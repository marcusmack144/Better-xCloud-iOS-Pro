name: Build IPA

on:
  push:
    branches:
      - main
      - Root
  pull_request:
    branches:
      - main
      - Root
  workflow_dispatch:

env:
  XCODE_VERSION: '15.0'
  DEPLOYMENT_TARGET: '14.0'
  MIN_OS_VERSION: '14.0'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.0.app/Contents/Developer

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Cache CocoaPods dependencies
        uses: actions/cache@v3
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod repo update
          
      - name: Install dependencies
        run: pod install --repo-update

      - name: Configure provisioning
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "${{ secrets.PROVISIONING_PROFILE }}" ]; then
            echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATE_PASSWORD }}
        if: secrets.CERTIFICATE_P12_BASE64 != ''

      - name: Build app for release
        run: |
          xcodebuild \
            -workspace Better-xCloud-iOS-Pro.xcworkspace \
            -scheme "Better-xCloud-iOS-Pro" \
            -configuration Release \
            -derivedDataPath build/derived \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}" \
            DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
            -verbose
        if: secrets.CERTIFICATE_P12_BASE64 != ''

      - name: Build unsigned app (fallback for testing)
        run: |
          xcodebuild \
            -workspace Better-xCloud-iOS-Pro.xcworkspace \
            -scheme "Better-xCloud-iOS-Pro" \
            -configuration Release \
            -derivedDataPath build/derived \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -verbose
        if: secrets.CERTIFICATE_P12_BASE64 == ''

      - name: Create IPA payload structure
        run: |
          mkdir -p build/Payload
          cp -r build/derived/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build && zip -r -q Better-xCloud-iOS-Pro.ipa Payload && cd ..
        if: success()

      - name: Upload IPA to artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Better-xCloud-iOS-Pro
          path: build/Better-xCloud-iOS-Pro.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Generate release notes
        id: release-notes
        run: |
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/Better-xCloud-iOS-Pro.ipa
          body: |
            Built on: ${{ steps.release-notes.outputs.BUILD_DATE }}
            Commit: ${{ steps.release-notes.outputs.GIT_HASH }}
            
            ### Features:
            - USB-C controller support
            - 5G optimization
            - Embedded Better xCloud userscript
          draft: false
          prerelease: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "Build failed. Check logs above for details."
          exit 1