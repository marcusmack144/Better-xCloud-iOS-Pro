name: Build Unsigned IPA

on:
  push:
    branches:
      - Root
      - main
  pull_request:
    branches:
      - Root
      - main
  workflow_dispatch:

env:
  XCODE_VERSION: '15.4'
  DEPLOYMENT_TARGET: '16.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select --switch /Applications/Xcode_15.3.app/Contents/Developer || \
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Download Better xCloud
        run: |
          chmod +x scripts/download-better-xcloud.sh
          bash scripts/download-better-xcloud.sh

      - name: Verify Better xCloud
        run: |
          SCRIPT="XCloudUltra/Resources/better-xcloud.user.js"
          if [ ! -f "$SCRIPT" ]; then
            echo "❌ Better xCloud script not found"
            exit 1
          fi
          
          VERSION=$(grep "@version" "$SCRIPT" | head -1 | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" || echo "unknown")
          echo "✓ Better xCloud version: $VERSION"
          
          if ! grep -q "6.7.12" "$SCRIPT"; then
            echo "⚠️ Warning: Expected Better xCloud 6.7.12"
          fi

      - name: Generate Xcode project
        run: |
          cd XCloudUltra
          xcodegen generate
          cd ..

      - name: Build unsigned IPA
        run: |
          BUILD_DIR="build"
          DERIVED_DATA="${BUILD_DIR}/derived"
          CONFIGURATION="Release"
          SDK="iphoneos"
          ARCH="arm64"
          
          mkdir -p "${BUILD_DIR}"
          rm -rf "${DERIVED_DATA}"
          
          xcodebuild \
            -project "XCloudUltra/project.xcodeproj" \
            -scheme "XCloudUltra" \
            -configuration "${CONFIGURATION}" \
            -derivedDataPath "${DERIVED_DATA}" \
            -sdk "${SDK}" \
            -arch "${ARCH}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" \
            -verbose 2>&1 | tee build.log

      - name: Create IPA structure
        run: |
          BUILD_DIR="build"
          DERIVED_DATA="${BUILD_DIR}/derived"
          CONFIGURATION="Release"
          PROJECT_NAME="XCloudUltra"
          
          APP_PATH="${DERIVED_DATA}/Build/Products/${CONFIGURATION}-iphoneos/${PROJECT_NAME}.app"
          
          if [ ! -d "${APP_PATH}" ]; then
            echo "❌ App not found at ${APP_PATH}"
            echo "Available products:"
            find "${DERIVED_DATA}/Build/Products" -type d -name "*.app" || echo "No .app found"
            exit 1
          fi
          
          IPA_PAYLOAD="${BUILD_DIR}/Payload"
          rm -rf "${IPA_PAYLOAD}"
          mkdir -p "${IPA_PAYLOAD}"
          
          cp -r "${APP_PATH}" "${IPA_PAYLOAD}/"
          
          # Clean up unnecessary files
          find "${IPA_PAYLOAD}" -name "*.swiftmodule" -type d -exec rm -rf {} + 2>/dev/null || true
          find "${IPA_PAYLOAD}" -name "*.modulemap" -delete 2>/dev/null || true
          find "${IPA_PAYLOAD}" -name ".DS_Store" -delete 2>/dev/null || true
          find "${IPA_PAYLOAD}" -name "*.dSYM" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Package IPA
        run: |
          BUILD_DIR="build"
          IPA_NAME="xcloud-ultra-unsigned.ipa"
          
          cd "${BUILD_DIR}"
          zip -r -q "${IPA_NAME}" Payload/
          cd ..
          
          IPA_PATH="${BUILD_DIR}/${IPA_NAME}"
          
          if [ ! -f "${IPA_PATH}" ]; then
            echo "❌ IPA not created"
            exit 1
          fi
          
          IPA_SIZE=$(du -h "${IPA_PATH}" | cut -f1)
          echo "✓ IPA created: ${IPA_PATH} (${IPA_SIZE})"

      - name: Validate IPA
        run: |
          BUILD_DIR="build"
          IPA_PATH="${BUILD_DIR}/xcloud-ultra-unsigned.ipa"
          PROJECT_NAME="XCloudUltra"
          
          echo "Validating IPA structure..."
          
          unzip -l "${IPA_PATH}" | grep -q "Payload/" || { echo "❌ Payload not found"; exit 1; }
          unzip -l "${IPA_PATH}" | grep -q "Payload/${PROJECT_NAME}.app/" || { echo "❌ .app not found"; exit 1; }
          unzip -l "${IPA_PATH}" | grep -q "Info.plist" || { echo "❌ Info.plist not found"; exit 1; }
          unzip -l "${IPA_PATH}" | grep -q "Payload/${PROJECT_NAME}.app/${PROJECT_NAME}" || { echo "❌ Executable not found"; exit 1; }
          
          if unzip -l "${IPA_PATH}" | grep -q "\.DS_Store"; then
            echo "❌ Found .DS_Store files"
            exit 1
          fi
          
          echo "✓ IPA validation passed"

      - name: Generate checksums
        run: |
          BUILD_DIR="build"
          cd "${BUILD_DIR}"
          shasum -a 256 xcloud-ultra-unsigned.ipa > xcloud-ultra-unsigned.ipa.sha256
          cd ..
          cat "${BUILD_DIR}/xcloud-ultra-unsigned.ipa.sha256"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xcloud-ultra-unsigned-ipa
          path: build/xcloud-ultra-unsigned.ipa
          retention-days: 30

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: xcloud-ultra-checksums
          path: build/xcloud-ultra-unsigned.ipa.sha256
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
